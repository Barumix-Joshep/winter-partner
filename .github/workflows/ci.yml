# 테스트 CI (P20-1). 운영 DB는 쓰지 않는다: GitHub 서버 안에 임시 로컬 Supabase를 띄워 거기에만 붙는다.
# 필수 상태 점검 이름: unit, db, e2e-core (docs/ci.md). 실제 AI는 부르지 않는다(AI_MOCK=1, 키 없음).
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SUPABASE_CLI_VERSION: 3.0.0
  # Supabase 서비스 중 테스트에 안 쓰는 것은 띄우지 않는다
  SUPABASE_EXCLUDE: realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 단위 테스트 (vitest)
        run: npm test

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: 로컬 Supabase 시작
        run: supabase start -x "$SUPABASE_EXCLUDE,mailpit" > /dev/null
      - name: 빈 DB에 마이그레이션 전부 + 시드 다시 적용 (db reset)
        run: supabase db reset --local
      - name: DB 테스트 (pgTAP)
        run: supabase test db

  e2e-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      E2E_SERVER: start # next build → next start (운영과 같은 빌드)
      E2E_SET: core # 리허설·시즌 종합 시나리오는 e2e-full.yml에서
      SUPABASE_BIN: supabase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: 로컬 Supabase 시작
        run: supabase start -x "$SUPABASE_EXCLUDE" > /dev/null
      - name: Playwright 브라우저 캐시
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Next 빌드 캐시
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: E2E 핵심 세트 (Playwright)
        run: npx playwright test
      - name: 실패하면 리포트·스크린샷·trace 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-core-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # main 병합 뒤(push) 실행이 실패하면 이슈를 남긴다. PR끼리 병합 순서가 엇갈려 합친 상태가 깨졌을 때
  # 아무도 모르고 지나가지 않게 한다(2026-11-06). 풀 리퀘스트에서는 돌지 않는다(PR 화면에 이미 보인다).
  report-failure:
    needs: [unit, db, e2e-core]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 실패 이슈 남기기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="main CI 실패 (병합 뒤)"
          n=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          body="실행: $RUN_URL (커밋 ${GITHUB_SHA::7}). 이 커밋은 이미 운영에 배포됐을 수 있습니다. 실패한 작업(unit·db·e2e-core)의 로그를 먼저 보고, Docker 내려받기 오류면 재실행, 진짜 실패면 고치는 PR을 바로 올리세요(docs/ci.md)."
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
