name: security
on:
  push:
    branches: [main]
  pull_request:
  # 매주 월 04:00 KST: 커밋 이력 전체 비밀값 검사 (PR·푸시 때는 그 변경의 커밋만 본다)
  schedule:
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 필수 상태 점검 이름: security (브랜치 보호에서 고른다, docs/ci.md)
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 보안 점검 (비밀값·RLS·service role·npm audit)
        run: node scripts/security-check.mjs
      - name: 린트
        run: npm run lint
      - name: 타입 검사
        run: npx tsc --noEmit
      # PR은 PR의 커밋, main 푸시는 마지막 커밋만 검사한다(gitleaks-action 기본 동작)
      - name: 이번 변경의 커밋 비밀값 검사 (gitleaks)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 커밋 이력 전체 비밀값 검사 (gitleaks, 매주·수동)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.3 git /repo --redact --log-opts="--all" --exit-code 2
