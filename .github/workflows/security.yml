name: security
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 필수 상태 점검 이름: security (브랜치 보호에서 고른다, docs/ci.md)
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 보안 점검 (비밀값·RLS·service role·npm audit)
        run: node scripts/security-check.mjs
      - name: 린트
        run: npm run lint
      - name: 타입 검사
        run: npx tsc --noEmit
      - name: 커밋 이력 전체 비밀값 검사 (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
